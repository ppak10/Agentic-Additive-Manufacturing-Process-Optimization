services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-sls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inova}
      POSTGRES_USER: ${POSTGRES_USER:-inova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inova}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inova} -d ${POSTGRES_DB:-inova}"]
      interval: 5s
      timeout: 5s
      retries: 5
