# Compose backbone — one service per folder under services/, pulled in via
# `include:`. Run everything from the repo root: `docker compose up -d`.
#
# `name:` is pinned to the pre-include project name (it used to derive from
# this directory's name) so existing containers keep their identity — do not
# change it, or compose will want to recreate the live postgres container.
#
# Host-coupled processes (recorder, broker, web, agent harness CLIs) stay
# systemd user units on purpose — see wiki Operations. Candidates that DO
# belong here later: vLLM for the fine-tuned model, embedding services.
name: agentic-additive-manufacturing-process-optimization

include:
  - services/postgres/compose.yml
  - services/pgadmin/compose.yml
