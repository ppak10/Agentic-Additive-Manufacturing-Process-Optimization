# Virtual uv workspace root — pure orchestration, like docker-compose.yml.
# The actual Python project (deps, console scripts, pytest config) lives in
# services/pipeline/pyproject.toml. uv keeps the shared lockfile + venv here,
# which is why `uv run sls-*` / `uv run pytest` work from the repo root.
[tool.uv.workspace]
members = ["services/pipeline"]
