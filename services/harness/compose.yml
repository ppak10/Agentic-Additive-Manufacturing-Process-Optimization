# Agent session broker (:3100) + the four harness CLIs, pinned in the image
# (see Dockerfile; agy bind-mounted). Auth state stays on the HOST via
# bind-mounted home dirs — interactive logins on the host refresh the
# container's credentials, and vice versa. Host networking: broker port,
# postgres, the Inova plugin, and the CLIs' outbound auth all flow as if
# on the host. Repo mounted at its real path (identical-path rule).
services:
  broker:
    build:
      context: ../..
      dockerfile: services/harness/Dockerfile
    container_name: agentic-sls-broker
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    working_dir: /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization
    command: ["services/harness/node_modules/.bin/tsx", "services/harness/server.ts"]
    environment:
      HOME: /home/node
    volumes:
      - ../..:/mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization
      # image-baked deps win over the repo bind (refresh: build + up -d -V)
      - /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization/services/harness/node_modules
      - /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization/services/plugins/mcp/node_modules
      - ~/.claude:/home/node/.claude
      - ~/.claude.json:/home/node/.claude.json
      - ~/.codex:/home/node/.codex
      - ~/.gemini:/home/node/.gemini
      - ~/.local/share/opencode:/home/node/.local/share/opencode
      - ~/.config/opencode:/home/node/.config/opencode
      - /home/linuxbrew/.linuxbrew/Caskroom/antigravity-cli/1.1.1,6269367663591424/antigravity:/usr/local/bin/agy:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/agent/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
