# Dashboard (React/Vite dev server, :5173) — the app source lives right
# here in this folder (services/web/ = compose fragment + app).
#
# Runs vite in DEV mode deliberately (HMR, LAN audience of one lab; the
# /api and /agent proxies in vite.config.ts are part of the serving
# contract). network_mode: host because those proxies target
# localhost:3000/3100 on the HOST (recorder + broker), and the LAN binding
# on 0.0.0.0:5173 carries over unchanged.
#
# The repo is bind-mounted at its REAL host path; dependencies are BAKED
# INTO THE IMAGE from this service's own lockfile and surfaced through an
# anonymous volume over node_modules (dependency isolation, 2026-07-16).
services:
  web:
    build: .
    container_name: agentic-sls-web
    restart: unless-stopped
    network_mode: host
    working_dir: /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization/services/web
    command: ["npm", "run", "dev"]
    volumes:
      - ../..:/mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization
      # anonymous volume: image-installed deps win over the repo bind at
      # this subpath (refresh with `docker compose up -d -V web`)
      - /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization/services/web/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
