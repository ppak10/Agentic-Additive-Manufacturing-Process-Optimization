# Dashboard (React/Vite dev server, :5173) — the app source lives right
# here in this folder (services/web/ = compose fragment + app).
#
# Runs vite in DEV mode deliberately (HMR, LAN audience of one lab; the
# /api and /agent proxies in vite.config.ts are part of the serving
# contract). network_mode: host because those proxies target
# localhost:3000/3100 on the HOST (recorder + broker), and the LAN binding
# on 0.0.0.0:5173 carries over unchanged.
#
# The repo is bind-mounted at its REAL host path and the command runs from
# the repo root via npm workspaces — node_modules are the hoisted root
# ones (same linux-x64/glibc platform in node:22-bookworm as the host, so
# native binaries like esbuild resolve identically).
services:
  web:
    image: node:22-bookworm
    container_name: agentic-sls-web
    restart: unless-stopped
    network_mode: host
    working_dir: /mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization
    command: ["npm", "run", "dev", "-w", "agentic-sls-web"]
    volumes:
      - ../..:/mnt/storage2/GitHub/Agentic-Additive-Manufacturing-Process-Optimization
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
